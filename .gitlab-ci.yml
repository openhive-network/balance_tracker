test_python_api_wheel:
  extends: .project_develop_configuration_template
  stage: test
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: build_python_api_client_wheel
    artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
    DIST_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package/dist"
  parallel:
