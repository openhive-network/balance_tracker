# Publish to registry.hive.blog - pull/retag/push only, no rebuild
publish_images:
  extends: .docker_publish_job_template
  variables:
    PUBLISH_IMAGES: "balance_tracker postgrest-rewriter"
  tags:
  - public-runner-docker

deploy_python_api_packages_to_gitlab:
  stage: publish
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: build_python_api_client_wheel
    artifacts: true
  - job: generate_python_api_client
    artifacts: true
  - job: python_api_client_test
  - job: test_python_api_wheel
  extends: .deploy_wheel_to_gitlab_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
  before_script:
  - *early_exit_check
  - !reference [.deploy_wheel_base, before_script]
