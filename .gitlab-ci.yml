stages:
- detect
- lint
- build
- sync
- test
- cleanup
- publish

variables:
  # =============================================================================
  # QUICK TEST MODE - Skip sync and use cached data
  # =============================================================================
  # Set QUICK_TEST=true to skip sync and use pre-cached HAF data.
  # Useful for testing SQL changes, API changes, or test fixes without full sync.
  #
  # Usage:
  #   QUICK_TEST=true
  #   QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list-haf-caches.sh)
  #
  # Find available caches: ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'
  # =============================================================================
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true
  # Auto-populated by detect_changes job:
  AUTO_SKIP_SYNC: "false"     # Set to true when only tests/docs/gui changed
  AUTO_CACHE_HAF_COMMIT: "219ef44775ee1ed85630cf513d8671f6ca4ccc49"   # Most recent cached HAF commit

  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 4
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  # HAF configuration
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  # NFS cache configuration for sync data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  # Cache keys include both HAF and balance_tracker commits for proper invalidation
  BTRACKER_CACHE_KEY: "${HAF_COMMIT}_${CI_COMMIT_SHORT_SHA}"
  # Cache types for different replay states (prefixed with haf_ for proper pgdata permission handling)
  BTRACKER_SYNC_CACHE_TYPE: "haf_btracker_sync"   # HAF + balance_tracker synced
  BTRACKER_MOCK_CACHE_TYPE: "haf_btracker_mock"   # HAF + balance_tracker + mock data
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  FF_NETWORK_PER_BUILD: 1
  # uses registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image:ubuntu24.04-py3.14-2
  BUILDER_IMAGE_TAG: ":ubuntu24.04-py3.14-2"
  BUILDER_IMAGE_PATH: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"
  PYTHON_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/ci-base-image${BUILDER_IMAGE_TAG}"
  # Python 3.12 image with poetry for pydantic-core based tools (pydantic-core doesn't support 3.14 yet)
  PYTHON_COMPAT_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/python:3.12.9-1"
  # HAF submodule commit - used for data caching and service containers
  HAF_COMMIT: "70c30036c6a5d0cb882d05aa22f42523a8f34970"
  # Hive submodule commit (inside HAF) - for fetching scripts from hive repo
  HIVE_SCRIPTS_REF: "1179c5456dbb6be65c73178eb53d2e02223de3a2"
  # Enable CI-specific PostgreSQL config with reduced memory for HAF service containers
  HAF_CI_MODE: "1"
  # Cache manager configuration (from common-ci-configuration)
  CACHE_MANAGER: "/tmp/cache-manager.sh"
  CACHE_MANAGER_REF: "develop"

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
# All CI templates from common-ci-configuration (Phase 2: direct includes)
- project: 'hive/common-ci-configuration'
  ref: fix/shm-dir-cache-structure
  file:
    - '/templates/base.gitlab-ci.yml'
    - '/templates/docker_image_jobs.gitlab-ci.yml'
    - '/templates/haf_data_preparation.gitlab-ci.yml'
    - '/templates/cache_cleanup.gitlab-ci.yml'
    - '/templates/python_projects.gitlab-ci.yml'
    - '/templates/npm_projects.gitlab-ci.yml'
    - '/templates/test_jobs.gitlab-ci.yml'
    - '/templates/haf_app_testing.gitlab-ci.yml'

# =============================================================================
# Early exit for doc-only changes
# =============================================================================
# Jobs can reference this to skip work when only docs/tests/gui changed.
# The job still runs and passes, but exits immediately without doing work.
.early_exit_for_docs_only:
  script: &early_exit_check
    - |
      if [[ "${AUTO_SKIP_SYNC:-false}" == "true" ]]; then
        echo "=== Skipping (docs/tests/gui only change) ==="
        echo "Only documentation, tests, or GUI files changed."
        echo "No work needed - exiting with success."
        exit 0
      fi

default:
  hooks:
    pre_get_sources_script:
      # Clean corrupt git state left by cancelled pipelines (see GitLab #296638, #4600)
      # Wrapped in subshell to avoid changing working directory for subsequent git operations
      - |
        (
        cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
        # Allow file:// transport for nested submodule operations (git 2.38.1+ security)
        git config --global protocol.file.allow always 2>/dev/null || true
        echo "pre_get_sources: checking $(pwd) for corrupt git state"
        if [ -d ".git" ]; then
          # Remove stale lock files that block git operations
          find .git -name "*.lock" -delete 2>/dev/null || true

          # Check if main repo is corrupt - if so, remove .git to force fresh clone
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            echo "pre_get_sources: main repository corrupt, forcing fresh clone"
            rm -rf .git
          else
            # Main repo OK - check and clean corrupt submodules
            # Check both the working dir and .git/modules/ since either can be corrupt
            if [ -f ".gitmodules" ]; then
              git config --file .gitmodules --get-regexp path 2>/dev/null | awk '{print $2}' | while read submod; do
                needs_clean=false
                [ -z "$submod" ] && continue
                # Check if submodule working directory exists but is corrupt
                if [ -d "$submod" ] && [ -f "$submod/.git" ]; then
                  if ! git -C "$submod" rev-parse HEAD >/dev/null 2>&1; then
                    needs_clean=true
                  fi
                fi
                # Check if .git/modules exists but is corrupt (even if working dir is gone)
                if [ -d ".git/modules/$submod" ]; then
                  if ! git --git-dir=".git/modules/$submod" rev-parse HEAD >/dev/null 2>&1; then
                    echo "pre_get_sources: $submod corrupt (rev-parse failed)"
                    needs_clean=true
                  fi
                fi
                if [ "$needs_clean" = true ]; then
                  echo "pre_get_sources: cleaning corrupt submodule: $submod"
                  rm -rf "$submod" ".git/modules/$submod"
                fi
              done
            else
              echo "pre_get_sources: no .gitmodules file"
            fi

            # Handle directory-to-submodule transitions inside submodules
            # Known paths that were converted from directories to submodules in hive
            # This list matches hive's .gitmodules - clean if they exist as directories
            if [ -d "haf" ]; then
              echo "pre_get_sources: checking haf for directory-to-submodule transitions"
              for nested in hive/libraries/fc hive/libraries/appbase; do
                nested_path="haf/$nested"
                modules_path=".git/modules/haf/modules/$nested"
                # If path exists as directory but not as a submodule, remove it
                if [ -d "$nested_path" ] && [ ! -f "$nested_path/.git" ]; then
                  echo "pre_get_sources: removing stale directory for submodule: $nested_path"
                  rm -rf "$nested_path"
                  # Also clean the .git/modules entry if it exists
                  if [ -d "$modules_path" ]; then
                    echo "pre_get_sources: removing stale .git/modules entry: $modules_path"
                    rm -rf "$modules_path"
                  fi
                fi
              done

              # Check if haf/hive submodule has corrupt origin (missing remote config)
              hive_modules=".git/modules/haf/modules/hive"
              if [ -d "$hive_modules" ]; then
                if ! git --git-dir="$hive_modules" remote get-url origin >/dev/null 2>&1; then
                  echo "pre_get_sources: haf/hive has corrupt origin, cleaning"
                  rm -rf "haf/hive" "$hive_modules"
                fi
              fi
            fi

            echo "pre_get_sources: existing repo OK"
          fi
        else
          echo "pre_get_sources: no .git directory (fresh workspace)"
        fi
        )

# =============================================================================
# Change Detection - Auto-skip sync when only tests/docs/gui change
# =============================================================================
# Detects if only tests/docs/gui changed and can use cached data.
# Exports: AUTO_SKIP_SYNC, AUTO_CACHE_HAF_COMMIT (via template)
detect_changes:
  extends: .haf_app_detect_changes
  variables:
    # Files that don't require re-sync:
    # - tests/, docs/, gui/ (don't affect sync)
    # - *.md, README, CHANGELOG, LICENSE (docs)
    # Note: SQL changes DO require sync (affect database schema)
    HAF_APP_SKIP_PATTERNS: '^tests/|^docs/|^gui/|\.md$|^README|^CHANGELOG|^LICENSE|^\.gitlab-ci\.yml$|^CLAUDE\.md$'

# =============================================================================
# LINT JOBS - Using common-ci-configuration templates
# =============================================================================
# These jobs use the new reusable lint templates from common-ci-configuration.
# The templates provide standardized linting with proper artifact handling.

lint_bash_scripts:
  extends: .haf_app_lint_bash
  stage: lint
  variables:
    LINT_SCRIPTS_DIR: "."  # Search from root
    LINT_EXCLUDE_PATHS: "haf"  # Exclude submodule
  needs:
  - job: detect_changes
    artifacts: true
    optional: true

lint_sql_scripts:
  extends: .haf_app_lint_sql
  stage: lint
  needs:
  - job: detect_changes
    artifacts: true
    optional: true

validate_haf_commit:
  extends: .haf_commit_validation
  stage: build
  variables:
    # Uses HAF_COMMIT from global variables - no need to duplicate here
    HAF_SUBMODULE_PATH: "haf"
  tags:
  - public-runner-docker

prepare_haf_image:
  stage: build
  extends: .prepare_haf_image
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf"
    REGISTRY_USER: "$HAF_DEPLOY_USERNAME"
    REGISTRY_PASS: "$HAF_DEPLOY_TOKEN"
  before_script:
  - git config --global --add safe.directory $CI_PROJECT_DIR/haf
  tags:
  - public-runner-docker
  - bigjob

extract-swagger-json:
  extends: .filter_out_swagger_json
  stage: build
  variables:
    INPUT_SQL_SWAGGER_FILE: "${CI_PROJECT_DIR}/endpoints/endpoint_schema.sql"
  tags:
  - public-runner-docker

generate_python_api_client:
  extends: .project_develop_configuration_template
  stage: build
  image: "${PYTHON_COMPAT_IMAGE}"
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
  needs:
  - job: extract-swagger-json
    artifacts: true
  before_script:
  - poetry -C "${PYPROJECT_DIR}" lock
  - poetry -C "${PYPROJECT_DIR}" install
  script:
  - ${PYPROJECT_DIR}/generate_balance_tracker_api_client.sh
  artifacts:
    paths:
    - "${PYPROJECT_DIR}/balance_api"
    - "${PYPROJECT_DIR}/balance_api/balance_api_client"
  tags:
  - public-runner-docker

build_python_api_client_wheel:
  extends: .build_wheel_template
  stage: build
  needs:
  - job: generate_python_api_client
    artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
  tags:
  - public-runner-docker

generate-wax-spec:
  extends: .generate_swagger_package
  stage: build
  variables:
    # Use artifact path directly - dotenv BUILT_JSON_SWAGGER_FILE contains absolute
    # path from previous job's runner which doesn't exist on this runner
    INPUT_JSON_SWAGGER_FILE: "${CI_PROJECT_DIR}/build/swagger-doc.json"
    API_TYPE: "rest"
    NAMESPACE: "balance_tracker"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax-api-balance-tracker"
  needs:
  - job: extract-swagger-json
    artifacts: true
  tags:
  - public-runner-docker

prepare_haf_data:
  extends: .prepare_haf_data_5m
  needs:
  - job: prepare_haf_image
    artifacts: true
  stage: build
  timeout: 80m
  variables:
    SUBMODULE_DIR: "$CI_PROJECT_DIR/haf"
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "$CI_PROJECT_DIR/haf/docker/config_5M.ini"
  tags:
  - data-cache-storage
  - fast

.docker-build-template:
  extends: .docker_image_builder_job_template
  stage: build
  variables:
    BASE_REPO_NAME: ""
    BASE_TAG: ""
    NAME: ""
    TARGET: "$NAME"
    PROGRESS_DISPLAY: "plain"
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    echo -e "\e[0Ksection_end:$(date +%s):tag\r\e[0K"
    echo -e "\e[0Ksection_start:$(date +%s):build[collapsed=true]\r\e[0KBaking $NAME${BASE_REPO_NAME:+/$BASE_REPO_NAME} image..."
    function image-exists() {
      local image=$1
      docker manifest inspect "$1" > /dev/null
      return $?
    }
    if image-exists "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:$BASE_TAG"; then
      echo "Image $CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG} already exists. Skipping..."
      if [[ -n "$CI_COMMIT_TAG" && "$TARGET" == "full-ci" ]]; then
        echo "Tagging pre-existing image with Git tag..."
        docker pull "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG}"
        docker tag "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
        docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
    else
      echo "Baking $CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG} image..."
      git config --global --add safe.directory $(pwd)
      scripts/ci-helpers/build_docker_image.sh "$CI_PROJECT_DIR"
    fi
    echo -e "\e[0Ksection_end:$(date +%s):build\r\e[0K"
  tags:
  - public-runner-docker
  - bigjob

docker-ci-runner-build:
  extends: .docker-build-template
  variables:
    BASE_REPO_NAME: ""
    BASE_TAG: "docker-24.0.1-17"
    NAME: "ci-runner"
    TARGET: "ci-runner-ci"

docker-setup-docker-image-build:
  extends: .docker-build-template
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: 1
    BASE_REPO_NAME: ""
    BASE_TAG: "$CI_COMMIT_SHORT_SHA"
    NAME: ""
    TARGET: "full-ci"

sync:
  extends:
  - .docker_image_builder_job_template
  - .haf_app_sync_variables
  stage: sync
  image: registry.gitlab.syncad.com/hive/balance_tracker/ci-runner:docker-24.0.1-17
  needs:
  - job: detect_changes
    artifacts: true
    optional: true  # Optional for tagged builds
  - prepare_haf_image
  - prepare_haf_data
  - docker-setup-docker-image-build
  - docker-ci-runner-build
  variables:
    BACKEND_VERSION: "$CI_COMMIT_SHORT_SHA"
    POSTGRES_ACCESS: postgresql://haf_admin@docker:5432/haf_block_log
    COMPOSE_OPTIONS_STRING: --env-file ci.env --file docker-compose.yml --file overrides/ci.yml
      --ansi never
    # Aliases for sync templates
    APP_SYNC_CACHE_TYPE: "${BTRACKER_SYNC_CACHE_TYPE}"
    APP_CACHE_KEY: "${BTRACKER_CACHE_KEY}"
  timeout: 2 hours  # NFS cache push can take 50+ minutes on slow days
  before_script:
  - !reference [.haf_app_sync_setup, script]
  - !reference [.haf_app_smart_cache_lookup, script]
  script:
  - |
    CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")

    echo -e "\e[0Ksection_start:$(date +%s):compose[collapsed=true]\r\e[0KStarting the test environment..."

    # cache-manager extracted directly to job directory with block_log symlinks and pgdata permissions fixed
    echo "Data ready at DATADIR=${DATADIR}"
    ls -la "${DATADIR}/" || true

    # Docker Compose bind mounts docker/blockchain over datadir/blockchain.
    # Copy blockchain files there so HAF can see them.
    # Use cp -aL to dereference symlinks (copy actual files, not symlink references)
    echo "Copying blockchain files to docker/blockchain..."
    rm -rf "${CI_PROJECT_DIR}/docker/blockchain"/*
    cp -aL "${DATADIR}/blockchain"/* "${CI_PROJECT_DIR}/docker/blockchain/"
    ls -la "${CI_PROJECT_DIR}/docker/blockchain/"

    # Remove blockchain dir from datadir so Docker volume mount doesn't conflict
    sudo rm -rf "${DATADIR}/blockchain"

    "${CI_PROJECT_DIR}/scripts/ci-helpers/start-ci-test-environment.sh"

    echo -e "\e[0Ksection_end:$(date +%s):compose\r\e[0K"

    if [[ "$CACHE_HIT" == "true" ]]; then
      echo "Cache hit - balance_tracker already synced, skipping wait"
    else
      echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0KWaiting for Balance Tracker to sync..."
      "${CI_PROJECT_DIR}/scripts/ci-helpers/wait-for-bt-startup.sh"
      echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"
    fi
  # Shutdown and save cache
  - !reference [.haf_app_sync_shutdown, script]
  - !reference [.haf_app_sync_save_cache_conditional, script]
  after_script: !reference [.haf_app_sync_cleanup, after_script]
  artifacts: !reference [.haf_app_sync_artifacts, artifacts]
  tags:
  - data-cache-storage
  - fast

sync_with_mock_data:
  extends: .docker_image_builder_job_template
  stage: sync
  image: registry.gitlab.syncad.com/hive/balance_tracker/ci-runner:docker-24.0.1-17
  needs:
  - job: detect_changes
    artifacts: true
    optional: true  # Optional for tagged builds
  - job: sync
    artifacts: true
  - job: docker-setup-docker-image-build
    artifacts: true
  - job: prepare_haf_image
    artifacts: true
  - job: docker-ci-runner-build
    artifacts: true
  variables:
    DATADIR: ${CI_PROJECT_DIR}/${CI_JOB_ID}/datadir
    SHM_DIR: ${CI_PROJECT_DIR}/${CI_JOB_ID}/shm_dir
    HAF_DATA_DIRECTORY: ${DATADIR}
    HAF_SHM_DIRECTORY: ${SHM_DIR}
    BACKEND_VERSION: "$CI_COMMIT_SHORT_SHA"
    POSTGRES_ACCESS: postgresql://haf_admin@docker:5432/haf_block_log
    COMPOSE_OPTIONS_STRING: --env-file ci.env --file docker-compose-mocks.yml --file
      overrides/ci.yml --ansi never
  timeout: 2 hours  # NFS cache push can take 50+ minutes on slow days
  before_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
    echo -e "\e[0Ksection_start:$(date +%s):git[collapsed=true]\r\e[0KConfiguring Git..."
    git config --global --add safe.directory "$CI_PROJECT_DIR"
    git config --global --add safe.directory "$CI_PROJECT_DIR/haf"
    echo -e "\e[0Ksection_end:$(date +%s):git\r\e[0K"
  - |
    # Handle QUICK_TEST mode or AUTO_SKIP_SYNC - use cached HAF data
    EFFECTIVE_HAF_COMMIT="${HAF_COMMIT}"
    if [[ "${QUICK_TEST:-false}" == "true" ]]; then
      echo "=== QUICK_TEST Mode (manual) ==="
      if [[ -z "${QUICK_TEST_HAF_COMMIT}" ]]; then
        echo "ERROR: QUICK_TEST=true but QUICK_TEST_HAF_COMMIT not set"
        exit 1
      fi
      EFFECTIVE_HAF_COMMIT="${QUICK_TEST_HAF_COMMIT}"
      echo "Using cached HAF data from: ${EFFECTIVE_HAF_COMMIT}"
    elif [[ "${AUTO_SKIP_SYNC:-false}" == "true" ]] && [[ -n "${AUTO_CACHE_HAF_COMMIT}" ]]; then
      echo "=== AUTO_SKIP_SYNC Mode (only tests/docs/gui changed) ==="
      EFFECTIVE_HAF_COMMIT="${AUTO_CACHE_HAF_COMMIT}"
      echo "Using cached HAF data from: ${EFFECTIVE_HAF_COMMIT}"
    fi

    # Cache-manager extracts directly to job directory - no copy needed
    EFFECTIVE_CACHE_KEY="${EFFECTIVE_HAF_COMMIT}_${CI_COMMIT_SHORT_SHA}"
    JOB_DATA_DIR="${CI_PROJECT_DIR}/${CI_JOB_ID}"

    # Fetch cache-manager from common-ci-configuration
    CACHE_MANAGER="/tmp/cache-manager.sh"
    if [[ ! -x "$CACHE_MANAGER" ]]; then
      curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
      chmod +x "$CACHE_MANAGER"
    fi
    CACHE_HIT="false"

    # Check for mock cache (already has mock data) - extract directly to job directory
    echo "Checking for mock cache: ${BTRACKER_MOCK_CACHE_TYPE}/${EFFECTIVE_CACHE_KEY}"
    if "$CACHE_MANAGER" get "${BTRACKER_MOCK_CACHE_TYPE}" "${EFFECTIVE_CACHE_KEY}" "${JOB_DATA_DIR}" 2>/dev/null; then
      echo "Mock cache found - skipping mock fill"
      CACHE_HIT="true"
    elif [[ "${AUTO_SKIP_SYNC:-false}" == "true" ]]; then
      # For docs-only changes, we can use ANY mock cache with matching HAF commit
      echo "Exact mock cache not found, searching for any mock cache with HAF commit ${EFFECTIVE_HAF_COMMIT}..."
      NFS_CACHE_DIR="${DATA_CACHE_NFS_PREFIX}/${BTRACKER_MOCK_CACHE_TYPE}"
      FOUND_CACHE=$(ls -t "${NFS_CACHE_DIR}/${EFFECTIVE_HAF_COMMIT}_"*.tar 2>/dev/null | head -1 || true)
      if [[ -n "$FOUND_CACHE" ]]; then
        FOUND_KEY=$(basename "$FOUND_CACHE" .tar)
        echo "Found compatible mock cache: ${FOUND_KEY}"
        EFFECTIVE_CACHE_KEY="${FOUND_KEY}"  # Update for save_cache
        if "$CACHE_MANAGER" get "${BTRACKER_MOCK_CACHE_TYPE}" "${FOUND_KEY}" "${JOB_DATA_DIR}" 2>/dev/null; then
          echo "Fetched compatible mock cache - skipping mock fill"
          CACHE_HIT="true"
        fi
      fi
      if [[ "$CACHE_HIT" != "true" ]]; then
        echo "No compatible mock cache found, will use btracker sync cache and fill mock data"
      fi
    else
      echo "Mock cache not found, will use btracker sync cache and fill mock data"
    fi

    # Fall back to btracker sync cache if no mock cache
    if [[ "$CACHE_HIT" != "true" ]]; then
      echo "Fetching btracker sync cache..."
      if "$CACHE_MANAGER" get "${BTRACKER_SYNC_CACHE_TYPE}" "${EFFECTIVE_CACHE_KEY}" "${JOB_DATA_DIR}" 2>/dev/null; then
        echo "Btracker sync cache ready"
      elif [[ "${AUTO_SKIP_SYNC:-false}" == "true" ]]; then
        # For docs-only changes, we can use ANY btracker cache with matching HAF commit
        echo "Exact btracker cache not found, searching for any btracker cache with HAF commit ${EFFECTIVE_HAF_COMMIT}..."
        NFS_CACHE_DIR="${DATA_CACHE_NFS_PREFIX}/${BTRACKER_SYNC_CACHE_TYPE}"
        FOUND_CACHE=$(ls -t "${NFS_CACHE_DIR}/${EFFECTIVE_HAF_COMMIT}_"*.tar 2>/dev/null | head -1 || true)
        if [[ -n "$FOUND_CACHE" ]]; then
          FOUND_KEY=$(basename "$FOUND_CACHE" .tar)
          echo "Found compatible btracker cache: ${FOUND_KEY}"
          EFFECTIVE_CACHE_KEY="${FOUND_KEY}"  # Update for save_cache
          if "$CACHE_MANAGER" get "${BTRACKER_SYNC_CACHE_TYPE}" "${FOUND_KEY}" "${JOB_DATA_DIR}"; then
            echo "Fetched compatible btracker sync cache"
          else
            echo "ERROR: Failed to fetch compatible btracker sync cache"
            exit 1
          fi
        else
          echo "ERROR: No compatible btracker cache found for HAF commit ${EFFECTIVE_HAF_COMMIT}"
          exit 1
        fi
      else
        echo "ERROR: Failed to fetch btracker sync cache"
        exit 1
      fi
    fi

    # Export for use in script and after_script sections
    echo "$CACHE_HIT" > /tmp/cache_hit
    echo "$EFFECTIVE_CACHE_KEY" > /tmp/effective_cache_key
  script:
  - |
    CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")

    # If we have a cache hit, the mock data already exists - skip docker-compose entirely
    if [[ "$CACHE_HIT" == "true" ]]; then
      echo "Cache hit - mock data already present in cache, skipping docker-compose"
      echo "Mock cache verified at: ${DATADIR}"
      ls -la "${DATADIR}/" || true
      exit 0
    fi

    echo -e "\e[0Ksection_start:$(date +%s):compose[collapsed=true]\r\e[0KStarting the test environment..."

    # cache-manager extracted directly to job directory with block_log symlinks and pgdata permissions fixed
    echo "Data ready at DATADIR=${DATADIR}"
    ls -la "${DATADIR}/" || true

    # Docker Compose bind mounts docker/blockchain over datadir/blockchain.
    # Copy blockchain files there so HAF can see them.
    echo "Copying blockchain files to docker/blockchain..."
    rm -rf "${CI_PROJECT_DIR}/docker/blockchain"/*
    cp -aL "${DATADIR}/blockchain"/* "${CI_PROJECT_DIR}/docker/blockchain/"
    echo "Contents of docker/blockchain after copy:"
    ls -la "${CI_PROJECT_DIR}/docker/blockchain/"
    echo "Total size:"
    du -sh "${CI_PROJECT_DIR}/docker/blockchain/"

    # Remove blockchain dir from datadir so Docker volume mount doesn't conflict with bind mount
    sudo rm -rf "${DATADIR}/blockchain"

    "${CI_PROJECT_DIR}/scripts/ci-helpers/start-ci-test-environment.sh"

    echo -e "\e[0Ksection_end:$(date +%s):compose\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0KWaiting for mock data fill..."
    "${CI_PROJECT_DIR}/scripts/ci-helpers/wait-for-bt-startup.sh"
    echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"

    # === Stop containers and save cache in main script ===
    # (Moved from after_script to avoid timeout issues with NFS push)
    echo -e "\e[0Ksection_start:$(date +%s):save_cache[collapsed=true]\r\e[0KStopping containers and saving cache..."

    CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")
    EFFECTIVE_CACHE_KEY=$(cat /tmp/effective_cache_key 2>/dev/null || echo "${BTRACKER_CACHE_KEY}")

    pushd docker
    IFS=" " read -ra COMPOSE_OPTIONS <<< $COMPOSE_OPTIONS_STRING

    # Force PostgreSQL checkpoint before shutdown
    echo "Forcing PostgreSQL checkpoint..."
    docker compose "${COMPOSE_OPTIONS[@]}" exec -T haf psql -U haf_admin -d haf_block_log -c "CHECKPOINT;" || true

    # Collect logs before stopping
    docker compose "${COMPOSE_OPTIONS[@]}" logs haf > haf.log
    docker compose "${COMPOSE_OPTIONS[@]}" logs fill-db-with-mock-data > fill-db-with-mock-data.log
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-block-processing > backend-block-processing.log

    # Use longer timeout (60s) for graceful PostgreSQL shutdown
    docker compose "${COMPOSE_OPTIONS[@]}" down --volumes --timeout 60
    popd

    tar -czvf docker/container-logs.tar.gz $(pwd)/docker/*.log

    # Save mock data to cache - data is already at job directory with correct structure
    JOB_DATA_DIR="${CI_PROJECT_DIR}/${CI_JOB_ID}"

    # Remove empty blockchain from cache (it was copied to docker/blockchain earlier)
    if [[ -d "${DATADIR}/blockchain" ]] && [[ -z "$(ls -A "${DATADIR}/blockchain" 2>/dev/null)" ]]; then
      echo "Removing empty blockchain directory from cache"
      rmdir "${DATADIR}/blockchain" 2>/dev/null || true
    fi

    ls -lah "${JOB_DATA_DIR}"
    ls -lah "${DATADIR}" || true
    ls -lah "${SHM_DIR}" || true

    # Push mock data to NFS cache for sharing across builders
    CACHE_MANAGER="/tmp/cache-manager.sh"
    if [[ ! -x "$CACHE_MANAGER" ]]; then
      curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
      chmod +x "$CACHE_MANAGER"
    fi
    echo "Pushing mock data to NFS: ${BTRACKER_MOCK_CACHE_TYPE}/${EFFECTIVE_CACHE_KEY}"
    if ! "$CACHE_MANAGER" put "${BTRACKER_MOCK_CACHE_TYPE}" "${EFFECTIVE_CACHE_KEY}" "${JOB_DATA_DIR}"; then
      echo "ERROR: Failed to push to NFS cache"
      exit 1
    fi
    echo "Successfully pushed mock cache to NFS"

    echo -e "\e[0Ksection_end:$(date +%s):save_cache\r\e[0K"
  after_script:
  - |
    # Cleanup only - cache push moved to main script to avoid timeout
    echo -e "\e[0Ksection_start:$(date +%s):cleanup[collapsed=true]\r\e[0KCleaning up..."

    # Manually remove the copy of the replay data to preserve disk space
    sudo rm -rf ${CI_PROJECT_DIR}/${CI_JOB_ID} 2>/dev/null || true

    echo -e "\e[0Ksection_end:$(date +%s):cleanup\r\e[0K"
  artifacts:
    paths:
    - docker/container-logs.tar.gz
    expire_in: 1 week
    when: always
  tags:
  - data-cache-storage
  - fast

# HAF instance with NFS fallback for sync data
# Services start before before_script, so we wait for job to extract data if needed
.haf-instance-with-nfs-fallback: &haf-instance-with-nfs-fallback
  name: ${HAF_IMAGE_NAME}
  alias: haf-instance
  variables:
    PGCTLTIMEOUT: 600
    PG_ACCESS: |
      "host    all              haf_admin        0.0.0.0/0    trust"
      "host    all              hived            0.0.0.0/0    trust"
      "host    all              btracker_user       0.0.0.0/0    trust"
      "host    all              btracker_owner      0.0.0.0/0    trust"
      "host    all              all              0.0.0.0/0    scram-sha-256"
    # Data extracted by job to ${CI_PROJECT_DIR}/${CI_JOB_ID}
    DATA_SOURCE: "${CI_PROJECT_DIR}/${CI_JOB_ID}"
  entrypoint:
    - '/bin/bash'
    - '-c'
    - |
      set -xeuo pipefail
      echo "Service container starting..."
      DATA_PATH="${DATA_SOURCE}"

      echo "DEBUG: DATA_PATH=${DATA_PATH}"

      # Wait for job to extract cache via cache-manager
      TIMEOUT=300
      WAITED=0
      while [[ ! -d "${DATA_PATH}/datadir" ]] && [[ $WAITED -lt $TIMEOUT ]]; do
        echo "Waiting for job extraction... ($WAITED/${TIMEOUT}s)"
        sleep 5
        WAITED=$((WAITED + 5))
      done

      if [[ -d "${DATA_PATH}/datadir" ]]; then
        echo "Data directory found at ${DATA_PATH}/datadir"
      else
        echo "ERROR: No data available after ${TIMEOUT}s"
        echo "  - Expected: ${DATA_PATH}/datadir"
        echo "Job must extract cache using cache-manager before service can start"
        exit 1
      fi

      echo "Contents of ${DATA_PATH}:"
      ls -la "${DATA_PATH}/" 2>/dev/null | head -10

      export DATA_SOURCE="${DATA_PATH}"

      # Run original entrypoint (cache-manager already fixed pgdata permissions)
      exec /home/haf_admin/docker_entrypoint.sh "$@"
    - '/bin/bash'
  command: ["--execute-maintenance-script=${HAF_SOURCE_DIR}/scripts/maintenance-scripts/sleep_infinity.sh"]

