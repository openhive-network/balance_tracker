stages:
- detect
- lint
- build
- sync
- test
- cleanup
- publish

variables:
  # =============================================================================
  # QUICK TEST MODE - Skip sync and use cached data
  # =============================================================================
  # Set QUICK_TEST=true to skip sync and use pre-cached HAF data.
  # Useful for testing SQL changes, API changes, or test fixes without full sync.
  #
  # Usage:
  #   QUICK_TEST=true
  #   QUICK_TEST_HAF_COMMIT=<sha>  (required - find with list-haf-caches.sh)
  #
  # Find available caches: ssh hive-builder-10 'ls -lt /nfs/ci-cache/haf/*.tar | head -5'
  # =============================================================================
  QUICK_TEST: "false"
  QUICK_TEST_HAF_COMMIT: ""   # Required when QUICK_TEST=true
  # Auto-set by detect_changes job when only tests/docs/gui changed:
  AUTO_SKIP_SYNC: "false"

  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 4
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  # HAF configuration
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  # NFS cache configuration for sync data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  # Cache keys include both HAF and balance_tracker commits for proper invalidation
  BTRACKER_CACHE_KEY: "${HAF_COMMIT}_${CI_COMMIT_SHORT_SHA}"
  # Cache types for different replay states (prefixed with haf_ for proper pgdata permission handling)
  BTRACKER_SYNC_CACHE_TYPE: "haf_btracker_sync"   # HAF + balance_tracker synced
  BTRACKER_MOCK_CACHE_TYPE: "haf_btracker_mock"   # HAF + balance_tracker + mock data
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  FF_NETWORK_PER_BUILD: 1
  # Centralized test runner image with Docker, pytest, tavern, and all test dependencies
  HAF_APP_TEST_RUNNER_IMAGE: "registry.gitlab.syncad.com/hive/common-ci-configuration/haf-app-test-runner:2.2"
  # =============================================================================
  # Upstream Image Detection (No Submodules Required)
  # =============================================================================
  # HAF image is dynamically detected by find_haf_image job using common-ci-configuration
  # scripts. No manual updates needed - always uses the latest built image from HAF repo.
  #
  # Output variables (set by find_haf_image job):
  #   HAF_UPSTREAM_IMAGE, HAF_UPSTREAM_COMMIT, HAF_UPSTREAM_TAG
  #   HAF_IMAGE_NAME, HAF_COMMIT (convenience aliases)
  # =============================================================================
  # Hive submodule commit (inside HAF) - for fetching scripts from hive repo
  HIVE_SCRIPTS_REF: "611a1726bcbc0f9689fa2c3fb5392795bf2a630f"
  # Enable CI-specific PostgreSQL config with reduced memory for HAF service containers
  HAF_CI_MODE: "1"
  # Cache manager configuration (from common-ci-configuration)
  CACHE_MANAGER: "/tmp/cache-manager.sh"
  CACHE_MANAGER_REF: "develop"
  # Set to "true" to run poetry update before install (uses latest dependency versions)
  TEST_WITH_LATEST_DEPENDENCIES: "false"
  # Common CI configuration reference
  COMMON_CI_REF: "develop"
  COMMON_CI_URL: "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/${COMMON_CI_REF}"

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
# All CI templates from common-ci-configuration (Phase 2: direct includes)
- project: 'hive/common-ci-configuration'
  ref: develop
  file:
    - '/templates/base.gitlab-ci.yml'
    - '/templates/docker_image_jobs.gitlab-ci.yml'
    - '/templates/haf_data_preparation.gitlab-ci.yml'
    - '/templates/cache_cleanup.gitlab-ci.yml'
    - '/templates/python_projects.gitlab-ci.yml'
    - '/templates/npm_projects.gitlab-ci.yml'
    - '/templates/test_jobs.gitlab-ci.yml'
    - '/templates/haf_app_testing.gitlab-ci.yml'
    - '/templates/source_change_detection.gitlab-ci.yml'

# =============================================================================
# Early exit for doc-only changes
# =============================================================================
# Jobs can reference this to skip work when only docs/tests/gui changed.
# The job still runs and passes, but exits immediately without doing work.
# Note: QUICK_TEST=true overrides AUTO_SKIP - user explicitly wants tests to run.
.early_exit_for_docs_only:
  script: &early_exit_check
    - |
      if [[ "${QUICK_TEST:-false}" == "true" ]]; then
        echo "=== QUICK_TEST mode: running tests with cached data ==="
      elif [[ "${AUTO_SKIP_SYNC:-false}" == "true" ]]; then
        echo "=== Skipping (docs/tests/gui only change) ==="
        echo "Only documentation, tests, or GUI files changed."
        echo "No work needed - exiting with success."
        exit 0
      fi

# Use common-ci-configuration template for git corruption cleanup
# Handles corrupt submodules and orphaned submodule directories
default:
  hooks:
    pre_get_sources_script:
      - !reference [.pre_get_sources_with_submodules, pre_get_sources_script]

# =============================================================================
# Change Detection - Auto-skip sync when only tests/docs/gui change
# =============================================================================
# Detects if only tests/docs/gui changed and can use cached data.
# Exports: AUTO_SKIP_SYNC, AUTO_CACHE_HAF_COMMIT (via template)
detect_changes:
  extends: .haf_app_detect_changes
  variables:
    # Files that don't require re-sync:
    # - tests/, docs/, gui/ (don't affect sync)
    # - *.md, README, CHANGELOG, LICENSE (docs)
    # Note: SQL changes DO require sync (affect database schema)
    HAF_APP_SKIP_PATTERNS: '^tests/|^docs/|^gui/|\.md$|^README|^CHANGELOG|^LICENSE|^\.gitlab-ci\.yml$|^CLAUDE\.md$'

find_haf_image:
  extends: .find_haf_image
  stage: detect
  variables:
    UPSTREAM_BRANCH: "develop"
    HAF_PATTERNS_REF: "develop"

# =============================================================================
# LINT JOBS - Using common-ci-configuration templates
# =============================================================================
# These jobs use the new reusable lint templates from common-ci-configuration.
# The templates provide standardized linting with proper artifact handling.

lint_bash_scripts:
  extends: .haf_app_lint_bash
  stage: lint
  variables:
    LINT_SCRIPTS_DIR: "."  # Search from root
    LINT_EXCLUDE_PATHS: "haf"  # Exclude submodule
  needs:
  - job: detect_changes
    artifacts: true
    optional: true

lint_sql_scripts:
  extends: .haf_app_lint_sql
  stage: lint
  needs:
  - job: detect_changes
    artifacts: true
    optional: true

verify_poetry_lock_stability_api_package:
  stage: lint
  extends: .verify_poetry_lock_stability_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
  tags:
    - public-runner-docker

verify_poetry_lock_stability_api_generation:
  stage: lint
  extends: .verify_poetry_lock_stability_template
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/api_generation"
  tags:
    - public-runner-docker

# Note: prepare_haf_image job removed - find_haf_image now provides
# HAF_IMAGE_NAME and HAF_COMMIT aliases directly (common-ci-configuration !285)

extract-swagger-json:
  extends: .filter_out_swagger_json
  stage: build
  variables:
    INPUT_SQL_SWAGGER_FILE: "${CI_PROJECT_DIR}/endpoints/endpoint_schema.sql"
  tags:
  - public-runner-docker

generate_python_api_client:
  extends: .project_develop_configuration_template
  stage: build
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/api_generation"
  needs:
  - job: extract-swagger-json
    artifacts: true
  script:
  - ${PYPROJECT_DIR}/generate_balance_tracker_api_client.sh
  artifacts:
    paths:
    - "${CI_PROJECT_DIR}/scripts/python_api_package/hiveio_balance_api"
    - "${CI_PROJECT_DIR}/scripts/python_api_package/hiveio_balance_api/balance_api_client"
  tags:
  - public-runner-docker

build_python_api_client_wheel:
  extends: .build_wheel_template
  stage: build
  needs:
  - job: generate_python_api_client
    artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
  tags:
  - public-runner-docker

generate-wax-spec:
  extends: .generate_swagger_package
  stage: build
  variables:
    # Use artifact path directly - dotenv BUILT_JSON_SWAGGER_FILE contains absolute
    # path from previous job's runner which doesn't exist on this runner
    INPUT_JSON_SWAGGER_FILE: "${CI_PROJECT_DIR}/build/swagger-doc.json"
    API_TYPE: "rest"
    NAMESPACE: "balance_tracker"
    NPM_PACKAGE_SCOPE: "@hiveio"
    NPM_PACKAGE_NAME: "wax-api-balance-tracker"
  needs:
  - job: extract-swagger-json
    artifacts: true
  tags:
  - public-runner-docker

prepare_haf_data:
  extends: .haf_app_prepare_data_with_find
  stage: build
  timeout: 80m
  variables:
    BLOCK_LOG_SOURCE_DIR: $BLOCK_LOG_SOURCE_DIR_5M
    CONFIG_INI_SOURCE: "/tmp/config_5M.ini"
    # HAF_IMAGE_NAME and HAF_COMMIT are now provided directly by find_haf_image
  before_script:
    - curl -fsSL "${COMMON_CI_URL}/haf-app-tools/config/config_5M.ini" -o /tmp/config_5M.ini
    # Log the mapped variables
    - echo "Using HAF image:${HAF_IMAGE_NAME} (commit:${HAF_COMMIT})"
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

.docker-build-template:
  extends: .docker_image_builder_job_template
  stage: build
  variables:
    BASE_REPO_NAME: ""
    BASE_TAG: ""
    NAME: ""
    TARGET: "$NAME"
    PROGRESS_DISPLAY: "plain"
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    echo -e "\e[0Ksection_end:$(date +%s):tag\r\e[0K"
    echo -e "\e[0Ksection_start:$(date +%s):build[collapsed=true]\r\e[0KBaking $NAME${BASE_REPO_NAME:+/$BASE_REPO_NAME} image..."
    function image-exists() {
      local image=$1
      docker manifest inspect "$1" > /dev/null
      return $?
    }
    if image-exists "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:$BASE_TAG"; then
      echo "Image $CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG} already exists. Skipping..."
      if [[ -n "$CI_COMMIT_TAG" && "$TARGET" == "full-ci" ]]; then
        echo "Tagging pre-existing images with Git tag..."
        # Tag main image
        docker pull "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG}"
        docker tag "$CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
        docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
        # Tag postgrest-rewriter image (also built by build_instance.sh)
        if image-exists "${CI_REGISTRY_IMAGE}/postgrest-rewriter:${BASE_TAG}"; then
          echo "Tagging postgrest-rewriter image..."
          docker pull "${CI_REGISTRY_IMAGE}/postgrest-rewriter:${BASE_TAG}"
          docker tag "${CI_REGISTRY_IMAGE}/postgrest-rewriter:${BASE_TAG}" "${CI_REGISTRY_IMAGE}/postgrest-rewriter:${CI_COMMIT_TAG}"
          docker push "${CI_REGISTRY_IMAGE}/postgrest-rewriter:${CI_COMMIT_TAG}"
        else
          echo "WARNING: postgrest-rewriter:${BASE_TAG} not found, skipping retag"
        fi
      fi
    else
      echo "Baking $CI_REGISTRY_IMAGE${NAME:+/$NAME}${BASE_REPO_NAME:+/$BASE_REPO_NAME}:${BASE_TAG} image..."
      git config --global --add safe.directory $(pwd)
      scripts/ci-helpers/build_docker_image.sh "$CI_PROJECT_DIR"
    fi
    echo -e "\e[0Ksection_end:$(date +%s):build\r\e[0K"
  tags:
  - bigjob

docker-setup-docker-image-build:
  extends: .docker-build-template
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: 1
    BASE_REPO_NAME: ""
    BASE_TAG: "$CI_COMMIT_SHORT_SHA"
    NAME: ""
    TARGET: "full-ci"

sync:
  extends:
  - .docker_image_builder_job_template
  - .haf_app_sync_variables
  stage: sync
  image: "${HAF_APP_TEST_RUNNER_IMAGE}"
  needs:
  - job: detect_changes
    artifacts: true
    optional: true  # Optional for tagged builds
  - find_haf_image
  - prepare_haf_data
  - docker-setup-docker-image-build
  variables:
    # DinD variables for Docker-in-Docker
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    BACKEND_VERSION: "$CI_COMMIT_SHORT_SHA"
    POSTGRES_ACCESS: postgresql://haf_admin@docker:5432/haf_block_log
    COMPOSE_OPTIONS_STRING: --env-file ci.env --file docker-compose.yml --file overrides/ci.yml
      --ansi never
    # HAF_REGISTRY_TAG needed by start-ci-test-environment.sh for ci.env
    HAF_REGISTRY_TAG: "${HAF_UPSTREAM_TAG}"
    # Aliases for sync templates
    APP_SYNC_CACHE_TYPE: "${BTRACKER_SYNC_CACHE_TYPE}"
    APP_CACHE_KEY: "${BTRACKER_CACHE_KEY}"
  timeout: 2 hours  # NFS cache push can take 50+ minutes on slow days
  before_script:
  - !reference [.haf_app_sync_setup, script]
  - !reference [.haf_app_smart_cache_lookup, script]
  script:
  - |
    CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")

    echo -e "\e[0Ksection_start:$(date +%s):compose[collapsed=true]\r\e[0KStarting the test environment..."

    # cache-manager extracted directly to job directory with block_log symlinks and pgdata permissions fixed
    echo "Data ready at DATADIR=${DATADIR}"
    ls -la "${DATADIR}/" || true

    # Relocate shm_dir from inside datadir to be a sibling (for old cache formats)
    if [[ -d "${DATADIR}/shm_dir" ]] && [[ ! -d "${SHM_DIR}" ]]; then
      echo "Relocating shm_dir to parallel location..."
      mv "${DATADIR}/shm_dir" "${SHM_DIR}"
    fi
    ls -la "${SHM_DIR}/" || true

    # Docker Compose bind mounts docker/blockchain over datadir/blockchain.
    # Copy blockchain files there so HAF can see them (only needed for fresh sync).
    # When CACHE_HIT is true, blockchain dir doesn't exist in cache (was removed during original sync).
    if [[ "$CACHE_HIT" != "true" ]]; then
      # Use cp -aL to dereference symlinks (copy actual files, not symlink references)
      echo "Copying blockchain files to docker/blockchain..."
      rm -rf "${CI_PROJECT_DIR}/docker/blockchain"/*
      cp -aL "${DATADIR}/blockchain"/* "${CI_PROJECT_DIR}/docker/blockchain/"
      ls -la "${CI_PROJECT_DIR}/docker/blockchain/"

      # Remove blockchain dir from datadir so Docker volume mount doesn't conflict
      sudo rm -rf "${DATADIR}/blockchain"
    else
      # Cache hit: HAF runs with --skip-hived, blockchain files not needed
      echo "Cache hit - skipping blockchain copy (not needed for --skip-hived mode)"
      mkdir -p "${CI_PROJECT_DIR}/docker/blockchain"
    fi

    "${CI_PROJECT_DIR}/scripts/ci-helpers/start-ci-test-environment.sh"

    echo -e "\e[0Ksection_end:$(date +%s):compose\r\e[0K"

    if [[ "$CACHE_HIT" == "true" ]]; then
      echo "Cache hit - balance_tracker already synced, skipping wait"
    else
      echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0KWaiting for Balance Tracker to sync..."
      "${CI_PROJECT_DIR}/scripts/ci-helpers/wait-for-bt-startup.sh"
      echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"
    fi

    # Finalize massive sync after replay (before cache save).
    # In CI the MASSIVE_PROCESSING stage never transitions to LIVE, so
    # finalize_massive_sync() is not called during block processing.
    # This sets tables LOGGED, switches to forking, restores indexes,
    # and bakes them into the cache for all downstream jobs.
    echo -e "\e[0Ksection_start:$(date +%s):indexes[collapsed=true]\r\e[0KFinalizing massive sync (LOGGED + forking + indexes)..."
    psql "$POSTGRES_ACCESS" <<'EOSQL'
    SET search_path TO btracker_app, public;
    SET ROLE btracker_owner;
    SELECT finalize_massive_sync('btracker_app');
    RESET ROLE;
    ANALYZE;
    EOSQL
    echo -e "\e[0Ksection_end:$(date +%s):indexes\r\e[0K"

  # Shutdown (inline override of .haf_app_sync_shutdown to use PATH-based pg_ctl for PG18 compat)
  - |
    echo -e "\e[0Ksection_start:$(date +%s):shutdown[collapsed=true]\r\e[0KStopping containers..."
    pushd docker
    IFS=" " read -ra COMPOSE_OPTIONS <<< $COMPOSE_OPTIONS_STRING
    HAF_CONTAINER="${HAF_CONTAINER_NAME:-haf}"

    echo "Requesting PostgreSQL checkpoint..."
    if ! docker compose "${COMPOSE_OPTIONS[@]}" exec -T "$HAF_CONTAINER" psql -U haf_admin -d haf_block_log -c "CHECKPOINT;" 2>&1; then
      echo "WARNING: Checkpoint request failed - PostgreSQL may be unhealthy"
      echo "Proceeding with pg_ctl stop which will attempt clean shutdown..."
    fi

    echo "Stopping PostgreSQL with pg_ctl (smart mode, 60s timeout)..."
    PG_CTL=$(docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres "$HAF_CONTAINER" \
        bash -c 'find /usr/lib/postgresql -name pg_ctl -type f 2>/dev/null | head -1' 2>/dev/null | tr -d '\r\n')
    echo "Found pg_ctl at: ${PG_CTL:-not found}"
    if [[ -n "$PG_CTL" ]]; then
      if ! docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres "$HAF_CONTAINER" \
          "$PG_CTL" stop -D /home/hived/datadir/haf_db_store/pgdata -m smart -t 60 2>&1; then
        echo "WARNING: pg_ctl smart stop failed, trying fast mode..."
        docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres "$HAF_CONTAINER" \
          "$PG_CTL" stop -D /home/hived/datadir/haf_db_store/pgdata -m fast -t 30 2>&1 || true
      fi
    else
      echo "WARNING: pg_ctl not found, relying on docker compose down for shutdown"
    fi

    docker compose "${COMPOSE_OPTIONS[@]}" logs "$HAF_CONTAINER" > haf.log || true
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-setup > backend-setup.log || true
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-block-processing > backend-block-processing.log || true
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-postgrest > backend-postgrest.log || true

    timeout 120 docker compose "${COMPOSE_OPTIONS[@]}" down --timeout "${COMPOSE_DOWN_TIMEOUT:-60}"
    popd

    tar -czvf docker/container-logs.tar.gz $(pwd)/docker/*.log
    echo -e "\e[0Ksection_end:$(date +%s):shutdown\r\e[0K"
  - !reference [.haf_app_sync_save_cache_conditional, script]
  after_script: !reference [.haf_app_sync_cleanup, after_script]
  artifacts: !reference [.haf_app_sync_artifacts, artifacts]
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

sync_with_mock_data:
  extends: .docker_image_builder_job_template
  stage: sync
  image: "${HAF_APP_TEST_RUNNER_IMAGE}"
  needs:
  - job: detect_changes
    artifacts: true
    optional: true  # Optional for tagged builds
  - job: sync
    artifacts: true
  - job: docker-setup-docker-image-build
    artifacts: true
  - job: find_haf_image
    artifacts: true
  variables:
    # DinD variables for Docker-in-Docker
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    DATADIR: ${CI_PROJECT_DIR}/${CI_JOB_ID}/datadir
    SHM_DIR: ${CI_PROJECT_DIR}/${CI_JOB_ID}/shm_dir
    HAF_DATA_DIRECTORY: ${DATADIR}
    HAF_SHM_DIRECTORY: ${SHM_DIR}
    BACKEND_VERSION: "$CI_COMMIT_SHORT_SHA"
    POSTGRES_ACCESS: postgresql://haf_admin@docker:5432/haf_block_log
    COMPOSE_OPTIONS_STRING: --env-file ci.env --file docker-compose-mocks.yml --file
      overrides/ci.yml --file overrides/ci-mocks.yml --ansi never
    # HAF_REGISTRY_TAG needed by start-ci-test-environment.sh for ci.env
    HAF_REGISTRY_TAG: "${HAF_UPSTREAM_TAG}"
  timeout: 2 hours  # NFS cache push can take 50+ minutes on slow days
  before_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
    echo -e "\e[0Ksection_start:$(date +%s):git[collapsed=true]\r\e[0KConfiguring Git..."
    git config --global --add safe.directory "$CI_PROJECT_DIR"
    git config --global --add safe.directory "$CI_PROJECT_DIR/haf"
    echo -e "\e[0Ksection_end:$(date +%s):git\r\e[0K"
  - |
    # Handle QUICK_TEST mode or AUTO_SKIP_SYNC - use cached HAF data
    EFFECTIVE_HAF_COMMIT="${HAF_COMMIT}"
    if [[ "${QUICK_TEST:-false}" == "true" ]]; then
      echo "=== QUICK_TEST Mode (manual) ==="
      if [[ -z "${QUICK_TEST_HAF_COMMIT}" ]]; then
        echo "ERROR: QUICK_TEST=true but QUICK_TEST_HAF_COMMIT not set"
        exit 1
      fi
      EFFECTIVE_HAF_COMMIT="${QUICK_TEST_HAF_COMMIT}"
      echo "Using cached HAF data from: ${EFFECTIVE_HAF_COMMIT}"
    elif [[ "${AUTO_SKIP_SYNC:-false}" == "true" ]] && [[ -n "${AUTO_CACHE_HAF_COMMIT}" ]]; then
      echo "=== AUTO_SKIP_SYNC Mode (only tests/docs/gui changed) ==="
      EFFECTIVE_HAF_COMMIT="${AUTO_CACHE_HAF_COMMIT}"
      echo "Using cached HAF data from: ${EFFECTIVE_HAF_COMMIT}"
    fi

    # Cache-manager extracts directly to job directory - no copy needed
    EFFECTIVE_CACHE_KEY="${EFFECTIVE_HAF_COMMIT}_${CI_COMMIT_SHORT_SHA}"
    JOB_DATA_DIR="${CI_PROJECT_DIR}/${CI_JOB_ID}"

    # Fetch cache-manager from common-ci-configuration
    CACHE_MANAGER="/tmp/cache-manager.sh"
    if [[ ! -x "$CACHE_MANAGER" ]]; then
      curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
      chmod +x "$CACHE_MANAGER"
    fi
    CACHE_HIT="false"

    # Check for mock cache (already has mock data) - extract directly to job directory
    # NOTE: Only exact key match - no fallback to caches from different app versions
    echo "Checking for mock cache: ${BTRACKER_MOCK_CACHE_TYPE}/${EFFECTIVE_CACHE_KEY}"
    if "$CACHE_MANAGER" get "${BTRACKER_MOCK_CACHE_TYPE}" "${EFFECTIVE_CACHE_KEY}" "${JOB_DATA_DIR}" 2>/dev/null; then
      echo "Mock cache found - skipping mock fill"
      CACHE_HIT="true"
    else
      echo "Mock cache not found (key: ${EFFECTIVE_CACHE_KEY}), will use btracker sync cache and fill mock data"
    fi

    # Fall back to btracker sync cache if no mock cache
    # NOTE: Only exact key match - no fallback to caches from different app versions
    if [[ "$CACHE_HIT" != "true" ]]; then
      echo "Fetching btracker sync cache: ${BTRACKER_SYNC_CACHE_TYPE}/${EFFECTIVE_CACHE_KEY}"
      if "$CACHE_MANAGER" get "${BTRACKER_SYNC_CACHE_TYPE}" "${EFFECTIVE_CACHE_KEY}" "${JOB_DATA_DIR}"; then
        echo "Btracker sync cache ready"
      else
        echo "ERROR: Failed to fetch btracker sync cache (key: ${EFFECTIVE_CACHE_KEY})"
        exit 1
      fi
    fi

    # Relocate shm_dir from inside datadir to be a sibling (for old caches)
    if [[ -d "${JOB_DATA_DIR}/datadir/shm_dir" && ! -d "${JOB_DATA_DIR}/shm_dir" ]]; then
      echo "Moving shm_dir from datadir/ to be a sibling..."
      sudo mv "${JOB_DATA_DIR}/datadir/shm_dir" "${JOB_DATA_DIR}/shm_dir"
    fi

    # Export for use in script and after_script sections
    echo "$CACHE_HIT" > /tmp/cache_hit
    echo "$EFFECTIVE_CACHE_KEY" > /tmp/effective_cache_key
  script:
  - |
    CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")

    # If we have a cache hit, the mock data already exists - skip docker-compose entirely
    if [[ "$CACHE_HIT" == "true" ]]; then
      echo "Cache hit - mock data already present in cache, skipping docker-compose"
      echo "Mock cache verified at: ${DATADIR}"
      ls -la "${DATADIR}/" || true
      exit 0
    fi

    echo -e "\e[0Ksection_start:$(date +%s):compose[collapsed=true]\r\e[0KStarting the test environment..."

    # cache-manager extracted directly to job directory with block_log symlinks and pgdata permissions fixed
    echo "Data ready at DATADIR=${DATADIR}"
    ls -la "${DATADIR}/" || true

    # Note: Blockchain files not needed - HAF runs with --skip-hived (PostgreSQL only)
    # The docker/blockchain bind mount will be empty, which is fine for database-only mode
    mkdir -p "${CI_PROJECT_DIR}/docker/blockchain"

    "${CI_PROJECT_DIR}/scripts/ci-helpers/start-ci-test-environment.sh"

    echo -e "\e[0Ksection_end:$(date +%s):compose\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0KWaiting for mock data fill..."
    "${CI_PROJECT_DIR}/scripts/ci-helpers/wait-for-bt-startup.sh"
    echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"

    # === Stop containers and save cache in main script ===
    # (Moved from after_script to avoid timeout issues with NFS push)
    echo -e "\e[0Ksection_start:$(date +%s):save_cache[collapsed=true]\r\e[0KStopping containers and saving cache..."

    CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")
    EFFECTIVE_CACHE_KEY=$(cat /tmp/effective_cache_key 2>/dev/null || echo "${BTRACKER_CACHE_KEY}")

    pushd docker
    IFS=" " read -ra COMPOSE_OPTIONS <<< $COMPOSE_OPTIONS_STRING

    # === Clean PostgreSQL shutdown ===
    # Using pg_ctl stop ensures PostgreSQL flushes all data to disk and creates
    # a clean shutdown checkpoint. This is more reliable than docker-compose down
    # which just sends SIGTERM and may not wait for full data flush.

    # First try checkpoint (informational - pg_ctl stop will do its own)
    echo "Requesting PostgreSQL checkpoint..."
    if ! docker compose "${COMPOSE_OPTIONS[@]}" exec -T haf psql -U haf_admin -d haf_block_log -c "CHECKPOINT;" 2>&1; then
      echo "WARNING: Checkpoint request failed - PostgreSQL may be unhealthy"
      echo "Proceeding with pg_ctl stop which will attempt clean shutdown..."
    fi

    # Use pg_ctl stop for clean shutdown - this ensures:
    # 1. All pending WAL is flushed
    # 2. A shutdown checkpoint is created
    # 3. All required PostgreSQL directories remain intact
    echo "Stopping PostgreSQL with pg_ctl (smart mode, 60s timeout)..."
    PG_CTL=$(docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres haf \
        bash -c 'find /usr/lib/postgresql -name pg_ctl -type f 2>/dev/null | head -1' 2>/dev/null | tr -d '\r\n')
    echo "Found pg_ctl at: ${PG_CTL:-not found}"
    if [[ -n "$PG_CTL" ]]; then
      if ! docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres haf \
          "$PG_CTL" stop -D /home/hived/datadir/haf_db_store/pgdata -m smart -t 60 2>&1; then
        echo "WARNING: pg_ctl smart stop failed, trying fast mode..."
        docker compose "${COMPOSE_OPTIONS[@]}" exec -T --user postgres haf \
          "$PG_CTL" stop -D /home/hived/datadir/haf_db_store/pgdata -m fast -t 30 2>&1 || true
      fi
    else
      echo "WARNING: pg_ctl not found, relying on docker compose down for shutdown"
    fi

    # Collect logs before stopping containers
    docker compose "${COMPOSE_OPTIONS[@]}" logs haf > haf.log || true
    docker compose "${COMPOSE_OPTIONS[@]}" logs fill-db-with-mock-data > fill-db-with-mock-data.log || true
    docker compose "${COMPOSE_OPTIONS[@]}" logs backend-block-processing > backend-block-processing.log || true

    # Now stop containers - PostgreSQL should already be stopped cleanly
    # Note: Don't use --volumes as it can interfere with bind-mount data persistence
    docker compose "${COMPOSE_OPTIONS[@]}" down --timeout 60
    popd

    tar -czvf docker/container-logs.tar.gz $(pwd)/docker/*.log

    # Save mock data to cache - data is already at job directory with correct structure
    JOB_DATA_DIR="${CI_PROJECT_DIR}/${CI_JOB_ID}"

    # Remove empty blockchain from cache (it was copied to docker/blockchain earlier)
    if [[ -d "${DATADIR}/blockchain" ]] && [[ -z "$(ls -A "${DATADIR}/blockchain" 2>/dev/null)" ]]; then
      echo "Removing empty blockchain directory from cache"
      rmdir "${DATADIR}/blockchain" 2>/dev/null || true
    fi

    ls -lah "${JOB_DATA_DIR}"
    ls -lah "${DATADIR}" || true
    ls -lah "${SHM_DIR}" || true

    # Push mock data to NFS cache for sharing across builders
    CACHE_MANAGER="/tmp/cache-manager.sh"
    if [[ ! -x "$CACHE_MANAGER" ]]; then
      curl -fsSL "https://gitlab.syncad.com/hive/common-ci-configuration/-/raw/develop/scripts/cache-manager.sh" -o "$CACHE_MANAGER"
      chmod +x "$CACHE_MANAGER"
    fi
    echo "Pushing mock data to NFS: ${BTRACKER_MOCK_CACHE_TYPE}/${EFFECTIVE_CACHE_KEY}"
    if ! "$CACHE_MANAGER" put "${BTRACKER_MOCK_CACHE_TYPE}" "${EFFECTIVE_CACHE_KEY}" "${JOB_DATA_DIR}"; then
      echo "ERROR: Failed to push to NFS cache"
      exit 1
    fi
    echo "Successfully pushed mock cache to NFS"

    echo -e "\e[0Ksection_end:$(date +%s):save_cache\r\e[0K"
  after_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):cleanup[collapsed=true]\r\e[0KCleaning up..."

    # Capture container logs on failure (main script log collection only runs on success)
    # Always overwrite - the existing tar.gz may be from the sync job's artifacts
    CACHE_HIT=$(cat /tmp/cache_hit 2>/dev/null || echo "false")
    if [[ "$CACHE_HIT" != "true" ]]; then
      pushd docker
      IFS=" " read -ra COMPOSE_OPTIONS <<< "$COMPOSE_OPTIONS_STRING"
      docker compose "${COMPOSE_OPTIONS[@]}" logs haf > haf.log 2>&1 || true
      docker compose "${COMPOSE_OPTIONS[@]}" logs fill-db-with-mock-data > fill-db-with-mock-data.log 2>&1 || true
      docker compose "${COMPOSE_OPTIONS[@]}" logs backend-block-processing > backend-block-processing.log 2>&1 || true
      docker compose "${COMPOSE_OPTIONS[@]}" down --timeout 30 2>&1 || true
      popd
      tar -czvf docker/container-logs.tar.gz docker/*.log 2>/dev/null || true
    fi

    # Manually remove the copy of the replay data to preserve disk space
    sudo rm -rf ${CI_PROJECT_DIR}/${CI_JOB_ID} 2>/dev/null || true

    echo -e "\e[0Ksection_end:$(date +%s):cleanup\r\e[0K"
  artifacts:
    paths:
    - docker/container-logs.tar.gz
    expire_in: 1 week
    when: always
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

# =============================================================================
# Shared DinD Test Template
# =============================================================================
# All test jobs use Docker-in-Docker to avoid service container race conditions.
# This ensures NFS data is extracted BEFORE containers start.

.test-with-docker-compose:
  extends:
    - .docker_image_builder_job_template
    - .haf_app_dind_test_variables
  stage: test
  image: "${HAF_APP_TEST_RUNNER_IMAGE}"
  variables:
    # DinD variables for Docker-in-Docker
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    # Map balance_tracker variables to common-ci template variables
    APP_SYNC_CACHE_TYPE: "${BTRACKER_SYNC_CACHE_TYPE}"
    APP_CACHE_KEY: "${BTRACKER_CACHE_KEY}"
    HAF_APP_ROLE_PREFIX: "btracker"
  timeout: 30 minutes
  before_script:
    - *early_exit_check
    - !reference [.docker_image_builder_job_template, before_script]
    - |
      echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
      echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
    - !reference [.haf_app_dind_extract_cache, script]
    - !reference [.haf_app_dind_compose_startup, script]
    - !reference [.haf_app_dind_wait_for_services, script]
  after_script: !reference [.haf_app_dind_compose_teardown, after_script]
  artifacts:
    when: always
    paths:
      - docker/container-logs.tar.gz
    expire_in: 1 week
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

# Standard needs for test jobs using sync cache
.test-needs-sync: &test-needs-sync
  needs:
    - job: detect_changes
      artifacts: true
      optional: true
    - job: sync
      artifacts: true
    - job: docker-setup-docker-image-build
      artifacts: true
    - job: find_haf_image
      artifacts: true

# Template for Tavern-based tests (uses centralized common-ci template)
.test-with-docker-compose-tavern:
  extends:
    - .docker_image_builder_job_template
    - .haf_app_dind_tavern_tests
  image: "${HAF_APP_TEST_RUNNER_IMAGE}"
  variables:
    # DinD variables for Docker-in-Docker
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
    # Map balance_tracker variables to common-ci template variables
    APP_SYNC_CACHE_TYPE: "${BTRACKER_SYNC_CACHE_TYPE}"
    APP_CACHE_KEY: "${BTRACKER_CACHE_KEY}"
    HAF_APP_ROLE_PREFIX: "btracker"
    BTRACKER_ADDRESS: localhost
    BTRACKER_PORT: 3000
    TAVERN_DIR: $CI_PROJECT_DIR/tests/tavern/patterns-mainnet
    PYTEST_WORKERS: "16"
  before_script:
    - *early_exit_check
    # Fetch tests_api submodule (not needed by other test jobs)
    - |
      curl -fsSL "${CI_SERVER_URL}/hive/common-ci-configuration/-/raw/${COMMON_CI_REF}/scripts/fetch-submodules.sh" -o /tmp/fetch-submodules.sh
      chmod +x /tmp/fetch-submodules.sh
      /tmp/fetch-submodules.sh tests_api
    - !reference [.docker_image_builder_job_template, before_script]
    - |
      echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
      echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
    - !reference [.haf_app_dind_tavern_tests, before_script]
    - |
      # Install tests_api into docker/venv where common-ci installed pytest/tavern
      # (common-ci's tavern_install_deps creates venv in docker/ due to compose_startup cd)
      . "${CI_PROJECT_DIR}/docker/venv/bin/activate"
      pip install -e "${CI_PROJECT_DIR}/tests_api"
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast

# =============================================================================
# Test Jobs
# =============================================================================

regression-test:
  extends: .test-with-docker-compose
  <<: *test-needs-sync
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning tests..."
      cd "${CI_PROJECT_DIR}/tests/regression"
      ./run_test.sh --host=docker
      echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
      - tests/regression/regression_test.log
      - docker/container-logs.tar.gz
    when: always

setup-scripts-test:
  extends: .test-with-docker-compose
  <<: *test-needs-sync
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning tests..."
      cd "${CI_PROJECT_DIR}/tests/functional"
      ./test_scripts.sh --host=docker
      echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"

performance-test:
  extends: .test-with-docker-compose
  <<: *test-needs-sync
  tags:
    - public-runner-docker
    - data-cache-storage
    - fast
  script:
    - |
      echo -e "\e[0Ksection_start:$(date +%s):tests\r\e[0KRunning tests..."
      cd "${CI_PROJECT_DIR}"
      # In DinD, services are available at 'docker' host
      timeout -k 1m 10m ./scripts/ci-helpers/run_performance_tests.sh --backend-host=docker --postgres-host=docker
      tar -czvf tests/performance/results.tar.gz $(pwd)/tests/performance/*result.*
      cat jmeter.log | python3 docker/ci/parse-jmeter-output.py
      m2u --input $(pwd)/tests/performance/result.xml --output $(pwd)/tests/performance/junit-result.xml
      echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    when: always
    paths:
      - docker/container-logs.tar.gz
      - tests/performance/result_report/
      - tests/performance/results.tar.gz
      - jmeter.log
    reports:
      junit: tests/performance/junit-result.xml

pattern-test:
  extends: .test-with-docker-compose-tavern
  <<: *test-needs-sync
  script:
    - |
      cd "${CI_PROJECT_DIR}"
      . docker/venv/bin/activate
      PGACCESS="postgresql://haf_admin@docker:5432/haf_block_log"

      # Indexes are created during sync (baked into cache).
      # Refresh planner stats after cache restore.
      echo -e "\e[0Ksection_start:$(date +%s):analyze[collapsed=true]\r\e[0KRunning ANALYZE..."
      psql "$PGACCESS" -c "ANALYZE;"
      echo -e "\e[0Ksection_end:$(date +%s):analyze\r\e[0K"

      # Diagnostic: run the slowest query (VESTS balance history for blocktrades)
      # with auto_explain to capture nested PL/pgSQL query plans in haf.log artifact
      echo -e "\e[0Ksection_start:$(date +%s):explain[collapsed=true]\r\e[0KRunning EXPLAIN diagnostic..."
      psql "$PGACCESS" <<'EOSQL' || echo "EXPLAIN diagnostic failed (non-fatal)"
      LOAD 'auto_explain';
      SET auto_explain.log_min_duration = 0;
      SET auto_explain.log_analyze = true;
      SET auto_explain.log_buffers = true;
      SET auto_explain.log_nested_statements = true;
      SET auto_explain.log_level = 'notice';
      SET search_path TO btracker_endpoints, btracker_app, btracker_backend, public;
      SET ROLE btracker_user;
      SET statement_timeout = '60s';
      \timing on
      SELECT * FROM btracker_endpoints.get_balance_history(
        "account-name" => 'blocktrades',
        "coin-type" => 'VESTS',
        "page-size" => 20
      );
      EOSQL
      echo -e "\e[0Ksection_end:$(date +%s):explain\r\e[0K"

      # In DinD, PostgREST is available at 'docker' host
      # Run from project root so pattern file paths resolve correctly
      BTRACKER_ADDRESS=docker pytest -n ${PYTEST_WORKERS:-$PYTEST_NUMBER_OF_PROCESSES} --junitxml "${JUNIT_REPORT}" "${TAVERN_DIR}"

pattern-test-with-mock-data:
  extends: .test-with-docker-compose-tavern
  needs:
    - job: detect_changes
      artifacts: true
      optional: true
    - job: sync_with_mock_data
      artifacts: true
    - job: docker-setup-docker-image-build
      artifacts: true
    - job: find_haf_image
      artifacts: true
  variables:
    # Use mock cache type instead of regular sync cache
    APP_SYNC_CACHE_TYPE: "${BTRACKER_MOCK_CACHE_TYPE}"
    # Override default tavern paths for mock tests
    JUNIT_REPORT: $CI_PROJECT_DIR/tests/tavern/patterns-mock/report.xml
    TAVERN_DIR: $CI_PROJECT_DIR/tests/tavern/patterns-mock
  script:
    - |
      cd "${CI_PROJECT_DIR}"
      . docker/venv/bin/activate
      # In DinD, PostgREST is available at 'docker' host
      # Run from project root so pattern file paths resolve correctly
      BTRACKER_ADDRESS=docker pytest -n ${PYTEST_WORKERS} --junitxml "${JUNIT_REPORT}" "${TAVERN_DIR}"

python_api_client_test:
  extends: .project_develop_configuration_template
  stage: test
  needs:
  - job: detect_changes
    artifacts: true
    optional: true
  - job: generate_python_api_client
    artifacts: true
  variables:
    PYPROJECT_DIR: "${CI_PROJECT_DIR}/scripts/python_api_package"
  parallel:
