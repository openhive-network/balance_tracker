---
test_name: btracker PostgREST
marks:
  - patterntest
includes:
  - !include ../../common.yaml

stages:
  - name: "HBD liquid holders in the mock data (the other half of total_hbd)"
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: HBD
        page-size: 10
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
