---
test_name: btracker PostgREST
marks:
  - patterntest
includes:
  - !include ../../common.yaml

stages:
  - name: "max-balance applies to the sum and keeps the global rank"
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: HBD
        balance-type: total
        max-balance: 77260000
        page-size: 3
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
