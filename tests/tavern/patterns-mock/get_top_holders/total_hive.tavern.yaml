---
test_name: btracker PostgREST
marks:
  - patterntest
includes:
  - !include ../../common.yaml

stages:
  - name: "HIVE liquid + savings over the mock savings fixtures"
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: HIVE
        balance-type: total
        page-size: 10
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
