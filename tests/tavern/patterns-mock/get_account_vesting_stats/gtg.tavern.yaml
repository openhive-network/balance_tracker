---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # issue #54: gtg vesting-stats over the routed-fill range. power_down_route_received
      # is populated (count 1, hive 7000); power_down_fill is zero (gtg never powered down).
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_vesting_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "gtg"
          granularity: "daily"
          direction: "desc"
          from-block: "90000054"
          to-block: "90000057"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
