---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # issue #54: blocktrades (the sender) vesting-stats over its power-down range.
      # power_down_init from the withdraw_vesting; power_down_fill aggregates all three
      # fills (count 3, vests 500000000) but hive only from the OWN fill (9500) — the
      # routed-away HIVE is not credited to the sender.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_vesting_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "blocktrades"
          granularity: "daily"
          direction: "desc"
          from-block: "90000054"
          to-block: "90000057"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
