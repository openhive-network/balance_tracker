---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # issue #54 (global): get_vesting_stats has no per-account fan-out — each fill is
      # counted once under power_down_fill (count 3, vests 500000000, hive 16500 = 7000+9500).
      # Locks process_vesting_stats.sql (tall tables, kinds 1-3) over the routed-power-down
      # fixture range.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_vesting_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          granularity: "daily"
          direction: "desc"
          from-block: "90000054"
          to-block: "90000057"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
