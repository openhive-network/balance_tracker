---
  test_name: btracker PostgREST - balance-clearing ops on null (#61)

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_balance_history"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "null"
          coin-type: "HIVE"
          page-size: 20
          from-block: "90000058"
          to-block: "90000060"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
