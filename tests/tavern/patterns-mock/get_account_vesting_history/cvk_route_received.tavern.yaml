---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # issue #54 (positive, auto_vest=true): the fill_vesting_withdraw routed
      # blocktrades -> cvk pays the recipient in VESTS. It must appear here under
      # power_down_route_received as VESTS (150000000), NOT under power_down_fill.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_vesting_history"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "cvk"
          filter: "power_down_route_received"
          from-block: "90000054"
          page-size: 100
          direction: "desc"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
