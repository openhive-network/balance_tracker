---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # One entry per account, in request order.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_accounts_balances"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          accounts: "gtg,blocktrades,enki"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
