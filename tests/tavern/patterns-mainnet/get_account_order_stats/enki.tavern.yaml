---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # Every order of a mostly-filling market maker: some still open at block 5,000,000.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_order_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "enki"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
