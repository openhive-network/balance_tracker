---
test_name: Enki lifecycle counts retain account ownership and open orders
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: Enki lifecycle counts retain account ownership and open orders
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_order_stats"
      method: GET
      params:
        account: "enki"
    response:
      status_code: 200
      headers:
        Cache-Control: "public, max-age=2"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
