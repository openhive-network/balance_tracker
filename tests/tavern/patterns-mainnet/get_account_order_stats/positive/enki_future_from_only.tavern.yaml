---
test_name: Account with an empty future creation cohort returns null fill rate
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: Account with an empty future creation cohort returns null fill rate
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_order_stats"
      method: GET
      params:
        account: "enki"
        from-date: "2020-01-01T00:00:00"
    response:
      status_code: 200
      headers:
        Cache-Control: "public, max-age=2"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
