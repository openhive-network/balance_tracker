---
test_name: btracker PostgREST
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: Open-ended minimum returns the upper bracket at global rank 1
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: VESTS
        min-balance: 225671901920188893
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
