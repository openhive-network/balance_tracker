---
test_name: btracker PostgREST
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: Range filtering works for a non-VESTS coin with global rank
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: HIVE
        min-balance: 50968139
        max-balance: 97417738
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
