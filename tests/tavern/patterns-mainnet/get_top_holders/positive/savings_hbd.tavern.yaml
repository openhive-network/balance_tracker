---
test_name: btracker PostgREST
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: "Top-100 HBD savings holders (the savings column of total_hbd)"
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: HBD
        balance-type: savings_balance
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
