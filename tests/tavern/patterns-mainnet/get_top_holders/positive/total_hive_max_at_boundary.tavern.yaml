---
test_name: btracker PostgREST
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: "max-balance is exclusive: a holder exactly at the bound is left out"
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: HIVE
        balance-type: total
        max-balance: 29594875
        page-size: 3
    response:
      status_code: 200
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
