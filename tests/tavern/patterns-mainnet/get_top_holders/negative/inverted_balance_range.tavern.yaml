---
test_name: Top holders reject inverted balance range bounds

marks:
  - patterntest
  - negative

includes:
  - !include ../../../common.yaml

stages:
  - name: Reject min-balance greater than max-balance
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: VESTS
        min-balance: 200000000
        max-balance: 100000000
    response:
      status_code: 400
      json:
        code: P0001
        details: null
        hint: null
        message: min-balance must be less than or equal to max-balance
