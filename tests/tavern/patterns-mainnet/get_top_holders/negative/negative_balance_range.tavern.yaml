---
test_name: Top holders reject negative balance range bounds

marks:
  - patterntest
  - negative

includes:
  - !include ../../../common.yaml

stages:
  - name: Reject negative min-balance
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: VESTS
        min-balance: -1
    response:
      status_code: 400
      json:
        code: P0001
        details: null
        hint: null
        message: min-balance and max-balance must be non-negative

  - name: Reject negative max-balance for HIVE
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_top_holders"
      method: GET
      params:
        coin-type: HIVE
        max-balance: -5
    response:
      status_code: 400
      json:
        code: P0001
        details: null
        hint: null
        message: min-balance and max-balance must be non-negative
