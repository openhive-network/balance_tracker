---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # A timestamp is the last block created at or before it.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_balances"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "blocktrades"
          at-block: "2016-08-01 00:00:00"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
