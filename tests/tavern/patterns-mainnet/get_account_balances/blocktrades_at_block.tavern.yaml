---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # Balances at block 4,000,000, during a power-down: the fields without history are null.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_balances"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "blocktrades"
          at-block: "4000000"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
