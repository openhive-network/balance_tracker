---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_vesting_stats"
        method: POST  
        headers:
          content-type: application/json
          accept: application/json  
        json:
          granularity: "daily"
          direction: "asc"
          from-block: "1"
          to-block: "200000"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
