---
  test_name: btracker PostgREST

  marks:
    - patterntest
    - negative

  includes:
    - !include ../../../common.yaml

  stages:
    - name: test
      # Explicit null page-size (RPC body) must be rejected, not silently treated
      # as "no limit" (which previously produced LIMIT NULL -> full-history scan).
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_balance_history"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "blocktrades"
          coin-type: "HBD"
          page-size: null
      response:
        status_code: 400
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            error_response: true
