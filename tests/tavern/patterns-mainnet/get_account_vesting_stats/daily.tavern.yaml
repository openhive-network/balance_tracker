---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_account_vesting_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          account-name: "blocktrades"
          granularity: "daily"
          direction: "desc"
          from-block: "4995000"
          to-block: "5000000"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
