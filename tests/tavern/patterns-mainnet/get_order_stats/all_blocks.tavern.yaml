---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # Every order of the synced blocks: created = filled + cancelled + open.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_order_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
