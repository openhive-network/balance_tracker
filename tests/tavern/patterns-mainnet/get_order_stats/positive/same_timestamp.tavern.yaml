---
test_name: Inclusive equal creation bounds retain a later canceled order
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: Inclusive equal creation bounds retain a later canceled order
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_order_stats"
      method: GET
      params:
        from-date: "2016-07-06T18:26:42"
        to-date: "2016-07-06T18:26:42"
    response:
      status_code: 200
      headers:
        Cache-Control: "public, max-age=2"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
