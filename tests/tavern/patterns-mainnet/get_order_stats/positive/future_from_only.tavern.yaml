---
test_name: Unbounded upper creation date with an empty future cohort
marks:
  - patterntest
includes:
  - !include ../../../common.yaml

stages:
  - name: Unbounded upper creation date with an empty future cohort
    request:
      url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_order_stats"
      method: GET
      params:
        from-date: "2020-01-01T00:00:00"
    response:
      status_code: 200
      headers:
        Cache-Control: "public, max-age=2"
      verify_response_with:
        function: validate_response:compare_rest_response_with_pattern
