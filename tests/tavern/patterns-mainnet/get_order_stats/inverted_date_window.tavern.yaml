---
  test_name: btracker PostgREST

  marks:
    - patterntest
    - negative

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # A from-block date after the to-block date.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_order_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          from-block: "2016-08-31 23:59:59"
          to-block: "2016-08-01 00:00:00"
      response:
        status_code: 400
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            error_response: true
