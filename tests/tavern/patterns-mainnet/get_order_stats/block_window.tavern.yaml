---
  test_name: btracker PostgREST

  marks:
    - patterntest

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # Orders created in blocks 4,000,000..4,500,000, outcomes counted to block 5,000,000.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_order_stats"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          from-block: "4000000"
          to-block: "4500000"
      response:
        status_code: 200
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
