---
  test_name: btracker PostgREST

  marks:
    - patterntest
    - negative

  includes:
    - !include ../../common.yaml

  stages:
    - name: test
      # A negative id is not a proposal id.
      request:
        url: "{service.proto:s}://{service.server:s}:{service.port}/rpc/get_proposals_payments"
        method: POST
        headers:
          content-type: application/json
          accept: application/json
        json:
          proposal-ids: "1,-1"
      response:
        status_code: 400
        verify_response_with:
          function: validate_response:compare_rest_response_with_pattern
          extra_kwargs:
            error_response: true
