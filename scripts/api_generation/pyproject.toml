[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "balance-api-generation"
version = "0.0.0"
package-mode = false
source = [
    { name = "gitlab-hive", url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple", priority = "supplemental" },
]

[tool.poetry.dependencies]
python = ">=3.14,<4"
hiveio-api-client-generator = ">=1.7.1"
hiveio-beekeepy = ">=1.28.5"
